name: Test, package and publish Fliqlo Ubuntu
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo python3-fonttools python3-brotli python3-pil gjs gir1.2-gtk-3.0 libglib2.0-bin xvfb dbus-x11 zip
      - name: Validate sources and tests
        run: ./scripts/check.sh
      - name: Build GNOME extension and Debian package
        run: |
          ./scripts/build-extension.sh
          ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fliqlo-ubuntu-release-candidates
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish GitHub prerelease
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: fliqlo-ubuntu-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fliqlo-ubuntu-release-candidates
          path: dist
      - name: Publish release for VERSION if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; not overwriting artifacts."
          else
            test -s "dist/fliqlo-ubuntu_${version}_all.deb"
            test -s "dist/fliqlo-ubuntu@luan-thnh-v${version}.zip"
            test -s "dist/fliqlo-ubuntu@luan-thnh-v${version}.zip.sha256"
            test -s dist/SHA256SUMS
            gh release create "$tag" \
              "dist/fliqlo-ubuntu_${version}_all.deb" \
              "dist/fliqlo-ubuntu@luan-thnh-v${version}.zip" \
              "dist/fliqlo-ubuntu@luan-thnh-v${version}.zip.sha256" \
              dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Fliqlo Ubuntu $tag (pre-release)" \
              --prerelease \
              --generate-notes \
              --notes "Unverified on a physical GNOME 50 desktop. Test on your system before publishing to GNOME Extensions. This project is unofficial and not affiliated with Fliqlo."
          fi
          # Delete only older version-numbered releases, never unrelated or newer tags.
          while IFS= read -r previous_tag; do
            [[ -n "$previous_tag" && "$previous_tag" != "$tag" ]] || continue
            [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            latest="$(printf '%s\n%s\n' "$previous_tag" "$tag" | sort -V | tail -n 1)"
            if [[ "$latest" == "$tag" ]]; then
              echo "Deleting older release and tag: $previous_tag"
              gh release delete "$previous_tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 200 --json tagName --jq '.[].tagName')
