name: Website · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.py'
      - 'docs/assets/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate landing page
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Build static website
        run: python3 scripts/build-website.py
      - name: Verify generated public site
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/assets/theme-ivory.png
          test -s _site/assets/appearance-clock-face.png
          test -f _site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish landing page
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
