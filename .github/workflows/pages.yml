name: Website · Validate and package

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.py'
      - 'docs/index.html'
      - 'docs/styles.css'
      - 'docs/app.js'
      - 'docs/favicon.svg'
      - 'docs/.nojekyll'
      - 'docs/assets/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub Pages landing page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build website and synchronize branch source
        run: python3 scripts/build-website.py --sync-docs
      - name: Verify published docs match website sources
        run: |
          git diff --exit-code -- docs/index.html docs/styles.css docs/app.js docs/favicon.svg
          test -s docs/index.html
          test -s docs/assets/theme-ivory.png
          test -f docs/.nojekyll
      - name: Upload previewable static artifact
        uses: actions/upload-artifact@v4
        with:
          name: fliqlo-ubuntu-website
          path: _site/
          if-no-files-found: error
          retention-days: 3
