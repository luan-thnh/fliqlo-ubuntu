name: Render cinematic product film

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render-promo-video.py'
      - '.github/workflows/promo-video.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fliqlo-promo-pinned-python
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use cached Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0" "numpy==2.2.6" "imageio-ffmpeg==0.6.0"
          python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
      - name: Render film and poster from the actual project screenshots
        run: python scripts/render-promo-video.py
      - name: Verify media
        run: |
          test -s docs/media/fliqlo-ubuntu-teaser.mp4
          test -s docs/media/fliqlo-ubuntu-poster.jpg
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          path='docs/media/fliqlo-ubuntu-teaser.mp4'
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          result=subprocess.run([ffmpeg,'-hide_banner','-i',path],
              capture_output=True,text=True)
          report=result.stderr
          assert 'Video: h264' in report, report
          assert 'Audio: aac' in report, report
          assert '1280x720' in report, report
          assert 'Duration: 00:00:16' in report, report
          print('Verified 16-second H.264/AAC 720p video')
          PY
      - name: Commit generated media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/fliqlo-ubuntu-teaser.mp4 docs/media/fliqlo-ubuntu-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets(video): render cinematic Fliqlo Ubuntu product film'
            git push origin HEAD:main
          fi
