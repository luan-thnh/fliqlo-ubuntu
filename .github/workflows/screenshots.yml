name: Capture real GTK screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-screenshots.py'
      - 'native/app.py'
      - 'native/style.css'
      - 'VERSION'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and headless desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libglib2.0-bin xvfb dbus-x11
      - name: Capture running native application
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-screenshots.py
      - name: Commit screenshots and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/appearance-light.png docs/assets/screensaver-light.png docs/assets/appearance-dark.png docs/assets/preview-fullscreen.png README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add real GTK settings screenshots'
            git push
          fi
