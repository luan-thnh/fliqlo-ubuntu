name: Capture real GTK screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-screenshots.py'
      - 'native/app.py'
      - 'native/style.css'
      - 'VERSION'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and headless desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libglib2.0-bin xvfb dbus-x11 python3-pil
      - name: Capture running native application (light and fullscreen preview)
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-screenshots.py
      - name: Capture native application in a fresh dark-theme session
        env:
          FLIQLO_SCREENSHOT_DARK: '1'
          GTK_THEME: 'Adwaita:dark'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-screenshots.py
      - name: Validate screenshots
        run: |
          test -s docs/assets/preview-fullscreen.png
          if cmp -s docs/assets/appearance-light.png docs/assets/appearance-dark.png; then
            echo '::error::Light and dark screenshots are identical'
            exit 1
          fi
      - name: Validate fullscreen preview contains visible clock pixels
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          picture = Image.open("docs/assets/preview-fullscreen.png").convert("RGB")
          bright = sum(1 for r, g, b in picture.getdata() if max(r, g, b) > 90)
          print(f"Fullscreen preview: {picture.width}x{picture.height}, {bright} bright pixels")
          if bright < 500:
              raise SystemExit("Fullscreen preview looks blank; refusing to publish screenshots")
          PY
      - name: Commit screenshots and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/appearance-light.png docs/assets/screensaver-light.png docs/assets/appearance-dark.png docs/assets/preview-fullscreen.png README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add real GTK settings screenshots'
            git push
          fi
