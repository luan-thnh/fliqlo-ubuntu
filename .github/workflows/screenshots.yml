name: Render sharp clock formats and capture GTK settings

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-screenshots.py'
      - 'scripts/render-clock-formats.py'
      - 'native/app.py'
      - 'native/render.py'
      - 'native/model.py'
      - 'native/style.css'
      - 'VERSION'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and Cairo/Pango rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 libglib2.0-bin xvfb dbus-x11 python3-pil fonts-dejavu-core
      - name: Render all three clock modes at native resolution
        run: /usr/bin/python3 scripts/render-clock-formats.py
      - name: Capture actual GTK light settings
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-screenshots.py
      - name: Capture actual GTK dark settings
        env:
          FLIQLO_SCREENSHOT_DARK: '1'
          GTK_THEME: 'Adwaita:dark'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-screenshots.py
      - name: Verify all formats are distinct and nonblank
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          folder = Path('docs/assets')
          names = ['clock-format-12h.png', 'clock-format-24h-short.png', 'clock-format-24h-padded.png']
          digests = []
          for name in names:
              path = folder / name
              with Image.open(path) as png:
                  if png.size != (1920, 1080):
                      raise SystemExit(f'{name}: unexpected size {png.size}')
                  image = png.convert('RGB')
                  bright = sum(1 for pixel in image.getdata() if max(pixel) > 90)
                  if bright < 5000:
                      raise SystemExit(f'{name}: clock appears blank')
              digests.append(hashlib.sha256(path.read_bytes()).hexdigest())
              print(f'{name}: 1920x1080, {bright} bright pixels')
          if len(set(digests)) != len(names):
              raise SystemExit('Clock format images are duplicates')
          if (folder / 'appearance-dark.png').read_bytes() == (folder / 'appearance-light.png').read_bytes():
              raise SystemExit('Light and dark GTK settings screenshots are identical')
          PY
      - name: Commit generated screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/clock-format-12h.png docs/assets/clock-format-24h-short.png docs/assets/clock-format-24h-padded.png
          git add docs/assets/appearance-light.png docs/assets/screensaver-light.png docs/assets/appearance-dark.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add crisp 12h and 24h renderer screenshots'
            git push
          fi
